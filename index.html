<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~ lofi vibes ~</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffd1dc, #ffccd5, #e2ece9, #dfedf5);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            font-family: 'Quicksand', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.3);
            text-align: center;
            width: 320px;
            transition: transform 0.3s ease;
        }

        .vinyl {
            width: 110px;
            height: 110px;
            background: #222;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #fff;
        }

        .vinyl-inner {
            width: 35px;
            height: 35px;
            background: #ffb7b2;
            border-radius: 50%;
            border: 3px dashed #fff;
        }

        .spinning {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 6px;
            font-weight: 600;
        }

        p {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 20px;
        }

        .play-btn {
            background-color: #ffb7b2;
            color: #fff;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 183, 178, 0.5);
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .play-btn:hover {
            background-color: #ff9aa2;
            transform: scale(1.08);
        }

        #statusText {
            font-size: 0.72rem;
            color: #e85d75;
            margin-top: 8px;
            min-height: 15px;
        }

        /* Cute fallback file upload button */
        .upload-container {
            margin-top: 15px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 12px;
        }

        .file-label {
            font-size: 0.75rem;
            color: #777;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid #ffb7b2;
            cursor: pointer;
            display: inline-block;
            transition: background 0.2s;
        }

        .file-label:hover {
            background: #ffb7b2;
            color: #fff;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="vinyl" id="vinylDisc">
            <div class="vinyl-inner"></div>
        </div>

        <h1>song1.mp3</h1>
        <p>tap to play ✨</p>

        <button class="play-btn" id="playBtn" onclick="togglePlay()">
            ▶
        </button>
        
        <div id="statusText"></div>

        <!-- Backup Upload Option if GitHub blocks direct hosting -->
        <div class="upload-container">
            <label class="file-label">
                📂 Choose song1.mp3 from phone
                <input type="file" id="fileInput" accept="audio/mp3,audio/*" onchange="loadLocalFile(event)">
            </label>
        </div>

        <!-- Audio Element -->
        <audio id="audioPlayer" src="song1.mp3" preload="auto" loop></audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const vinyl = document.getElementById('vinylDisc');
        const statusText = document.getElementById('statusText');

        function togglePlay() {
            statusText.innerText = "";
            
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.innerHTML = '❚❚';
                    vinyl.classList.add('spinning');
                }).catch(err => {
                    console.error(err);
                    statusText.innerText = "Hosting block detected! Use the button below to pick the file from your phone.";
                });
            } else {
                audio.pause();
                playBtn.innerHTML = '▶';
                vinyl.classList.remove('spinning');
            }
        }

        // Allows direct local file selection as a foolproof backup
        function loadLocalFile(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                audio.src = fileURL;
                statusText.style.color = "#52b788";
                statusText.innerText = "Loaded: " + file.name + " ✨";
                audio.play().then(() => {
                    playBtn.innerHTML = '❚❚';
                    vinyl.classList.add('spinning');
                });
            }
        }
    </script>
</body>
</html>
